<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Pinder Admin Login</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
    }

    .login-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      color: white;
      margin-bottom: 24px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #f59e0b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #error {
      color: #ef4444;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>Pinder Admin</h1>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      />

      <button type="submit">
        Login
      </button>

      <p id="error"></p>
    </form>
  </div>

  <script src="login.js"></script>

</body>
</html>
